site_name: Vigilant
theme:
  features:
    - content.code.copy
  palette:
    scheme: slate
  font: false
  logo: img/logo/icon.png
  favicon: img/logo/favicon.ico

use_directory_urls: false

plugins:
  - privacy
  - offline

nav:
  - "Home": index.md
  - "Installation": install.md
  - "Configuration":
      - "Environment Variables": environment-variables.md
      - "Feeds File": feeds.md
  - "Changelog": changelog.md
  - "Dev Containers": dev-containers.md
  - "Source Code": "https://github.com/VerifiedJoseph/vigilant"
  - "Licenses": licenses.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

